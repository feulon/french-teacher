<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Sem conexão · Francês</title>
<style>
  :root { color-scheme: light dark; --paper:#fbf6ea; --card:#fffefa; --ink:#1b2340; --muted:#5c6278; --rule:#cad6ee; --rule-2:#a5b8e2; --margin:#e2766c; --accent:#c23b25; --on-accent:#fff; }
  @media (prefers-color-scheme: dark) { :root { --paper:#11172a; --card:#1a2238; --ink:#f3ecdb; --muted:#a8afc4; --rule:#2b3659; --rule-2:#3d4d7f; --margin:#d0655b; --accent:#ff8068; --on-accent:#2a0f08; } }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100dvh; display: grid; place-items: center; padding: 24px 20px; background: var(--paper); color: var(--ink); font: 16px/1.35 system-ui, sans-serif; }
  main { position: relative; width: 100%; max-width: 390px; padding: 24px 20px 28px 66px; background: var(--card); border: 1px solid var(--rule); border-radius: 22px; overflow: hidden; }
  main::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50px; width: 1.5px; background: var(--margin); opacity: .85; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  h1 { margin: 8px 0 12px; font: 600 34px/1.05 Georgia, serif; text-decoration: underline double var(--accent); text-decoration-thickness: 1.5px; text-underline-offset: 7px; width: fit-content; }
  p { color: var(--muted); margin-bottom: 20px; }
  button { width: 100%; min-height: 64px; border: 0; border-radius: 20px; background: var(--accent); color: var(--on-accent); font: 700 18px system-ui, sans-serif; cursor: pointer; box-shadow: inset 0 -3px 0 rgba(0,0,0,.16); }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="eyebrow" style="margin:0">Offline</p>
  <h1>Sem conexão</h1>
  <p>Você está sem internet. Assim que a conexão voltar, tente de novo.</p>
  <button type="button" onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
